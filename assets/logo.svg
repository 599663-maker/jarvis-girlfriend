<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171233"/>
      <stop offset="0.55" stop-color="#0D0F22"/>
      <stop offset="1" stop-color="#05060F"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF86C0"/>
      <stop offset="0.5" stop-color="#F04FA0"/>
      <stop offset="1" stop-color="#8F3DFF"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39E2FF"/>
      <stop offset="1" stop-color="#7AC8FF"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFC9E4"/>
      <stop offset="1" stop-color="#B9A5FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#F04FA0" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#8F3DFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8F3DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="216" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="216" fill="url(#halo)"/>

  <!-- faint circuit grid -->
  <g stroke="#5B4C8F" stroke-opacity="0.16" stroke-width="2" fill="none">
    <path d="M96 256 H260 l28 28 v84 H96 Z"/>
    <path d="M928 256 H764 l-28 28 v84 h192 Z"/>
    <path d="M96 768 h176 l28 -28 v-84 H96 Z"/>
    <path d="M928 768 H748 l-28 -28 v-84 h208 Z"/>
  </g>

  <!-- back glow -->
  <circle cx="512" cy="470" r="230" fill="#F04FA0" opacity="0.18" filter="url(#softGlow)"/>

  <!-- circuit traces into the heart -->
  <g stroke="url(#trace)" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M120 520 H280 l56 -56 v-40"/>
    <path d="M904 520 H744 l-56 -56 v-40"/>
    <path d="M120 520 H280 l56 56 v40"/>
    <path d="M904 520 H744 l-56 56 v40"/>
  </g>
  <g fill="#39E2FF">
    <circle cx="120" cy="520" r="16"/>
    <circle cx="904" cy="520" r="16"/>
    <circle cx="352" cy="400" r="11"/>
    <circle cx="672" cy="400" r="11"/>
    <circle cx="352" cy="636" r="11"/>
    <circle cx="672" cy="636" r="11"/>
  </g>

  <!-- heart -->
  <g filter="url(#glow)">
    <path d="M256 464 C256 464 96 320 96 208 C96 128 160 64 224 64 C256 64 256 96 256 96 C256 96 256 64 288 64 C352 64 416 128 416 208 C416 320 256 464 256 464 Z"
          transform="translate(512,330) scale(1.2) translate(-256,-64)"
          fill="url(#heart)" stroke="#FFD1E8" stroke-opacity="0.55" stroke-width="6"/>
    <!-- inner shine -->
    <path d="M256 464 C256 464 150 350 150 262 C150 210 184 176 224 176 C250 176 256 196 256 196 C256 196 262 176 288 176 C328 176 362 210 362 262 C362 350 256 464 256 464 Z"
          transform="translate(512,330) scale(1.2) translate(-256,-64)"
          fill="#FFD9EC" opacity="0.22"/>
  </g>

  <!-- ECG pulse across the heart -->
  <g stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <path d="M312 552 h96 l24 -44 l28 96 l24 -52 h208"/>
  </g>
  <circle cx="312" cy="552" r="9" fill="#FFFFFF"/>
  <circle cx="692" cy="552" r="9" fill="#FFFFFF"/>

  <!-- wordmark -->
  <text x="512" y="912" text-anchor="middle"
        font-family="SF Pro Display, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="16" fill="url(#word)">JARVIS</text>
  <text x="512" y="972" text-anchor="middle"
        font-family="SF Pro Display, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="34" font-weight="400" letter-spacing="30" fill="#8F93B8">GIRLFRIEND</text>
</svg>
